<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .node-green {
        fill: #dcfce7;
        stroke: #4ade80;
        stroke-width: 1.2;
      }
      .node-green-leaf {
        fill: #ecfdf5;
        stroke: #86efac;
        stroke-width: 1;
      }
      .node-teal {
        fill: #2dd4bf;
        stroke: #0d9488;
        stroke-width: 1.3;
      }
      .line-trunk {
        stroke: #64748b;
        stroke-width: 1.3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .line-carpinteria {
        stroke: #0d9488;
        stroke-width: 1.2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>

    <!-- Marcador de flecha gris -->
    <marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#64748b" />
    </marker>

    <!-- Marcador de flecha teal -->
    <marker id="arrow-teal" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1 L 5 3 L 0 5 z" fill="#0d9488" />
    </marker>
  </defs>

  <!-- Fondo blanco contenedor -->
  <rect x="1" y="1" width="758" height="208" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Etiqueta superior "Mapa" -->
  <rect x="8" y="7" width="38" height="15" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
  <text x="27" y="17.5" font-size="7" font-weight="600" fill="#64748b" text-anchor="middle">Mapa</text>

  <!-- ========================================================================
       NIVEL 1: DIRECTOR GENERAL (MAURO)
       ======================================================================== -->
  <g id="nodo-director">
    <rect x="305" y="8" width="114" height="26" rx="5" class="node-green" />
    <text x="362" y="19" font-size="7.5" font-weight="700" fill="#14532d" text-anchor="middle">Director General</text>
    <text x="362" y="28.5" font-size="6.8" font-weight="500" fill="#166534" text-anchor="middle">Mauro</text>
  </g>

  <!-- Tronco central de bajada desde Mauro -->
  <path d="M 362 34 L 362 44 M 142 44 L 565 44" class="line-trunk" />

  <!-- ========================================================================
       NIVEL 2: RAMAS PRINCIPALES (ADMINISTRACIÓN, DISEÑO, CONTROL PLANTA)
       ======================================================================== -->

  <!-- 1. Administradora General -->
  <path d="M 142 44 L 142 52" class="line-trunk" marker-end="url(#arrow)" />
  <g id="nodo-admin">
    <rect x="82" y="52" width="120" height="22" rx="4" class="node-green" />
    <text x="142" y="66.5" font-size="7.4" font-weight="700" fill="#14532d" text-anchor="middle">Administradora General</text>
  </g>

  <!-- 2. Diseño (Reporte directo a Dirección) -->
  <path d="M 345 44 L 345 52" class="line-trunk" marker-end="url(#arrow)" />
  <g id="nodo-diseno-central">
    <rect x="318" y="52" width="54" height="22" rx="4" class="node-green" />
    <text x="345" y="66.5" font-size="7.4" font-weight="700" fill="#14532d" text-anchor="middle">Diseño</text>
  </g>

  <!-- 3. Control de Planta -->
  <path d="M 565 44 L 565 52" class="line-trunk" marker-end="url(#arrow)" />
  <g id="nodo-control-planta">
    <rect x="505" y="52" width="120" height="22" rx="4" class="node-green" />
    <text x="565" y="66.5" font-size="7.4" font-weight="700" fill="#14532d" text-anchor="middle">Control de Planta</text>
  </g>

  <!-- ========================================================================
       RAMA IZQUIERDA: BAJADA DE ADMINISTRADORA -> REDES Y VENTAS
       ======================================================================== -->
  <path d="M 142 74 L 142 84 M 72 84 L 212 84" class="line-trunk" />

  <!-- Sub-rama Redes -->
  <path d="M 72 84 L 72 92" class="line-trunk" marker-end="url(#arrow)" />
  <g id="nodo-redes">
    <rect x="38" y="92" width="68" height="20" rx="4" class="node-teal" />
    <text x="72" y="105.5" font-size="7.5" font-weight="700" fill="#042f2e" text-anchor="middle">Redes</text>
  </g>

  <!-- Hijos de Redes: Diseño y Marketing -->
  <path d="M 72 112 L 72 120 M 42 120 L 102 120" class="line-trunk" />
  <path d="M 42 120 L 42 128" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="18" y="128" width="48" height="18" rx="3" class="node-green-leaf" />
  <text x="42" y="140" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">Diseño</text>

  <path d="M 102 120 L 102 128" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="76" y="128" width="52" height="18" rx="3" class="node-green-leaf" />
  <text x="102" y="140" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">Marketing</text>

  <!-- Sub-rama Ventas -->
  <path d="M 212 84 L 212 92" class="line-trunk" marker-end="url(#arrow)" />
  <g id="nodo-ventas">
    <rect x="178" y="92" width="68" height="20" rx="4" class="node-teal" />
    <text x="212" y="105.5" font-size="7.5" font-weight="700" fill="#042f2e" text-anchor="middle">Ventas</text>
  </g>

  <!-- Hijos de Ventas: Minoristas y Mayoristas -->
  <path d="M 212 112 L 212 120 M 182 120 L 242 120" class="line-trunk" />
  <path d="M 182 120 L 182 128" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="156" y="128" width="52" height="18" rx="3" class="node-green-leaf" />
  <text x="182" y="140" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">Minoristas</text>

  <path d="M 242 120 L 242 128" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="216" y="128" width="52" height="18" rx="3" class="node-green-leaf" />
  <text x="242" y="140" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">Mayoristas</text>

  <!-- ========================================================================
       RAMA DERECHA: BAJADA DE CONTROL DE PLANTA
       ======================================================================== -->
  <!-- Distribuidor desde Control de Planta hacia Carpintería y Especialidades -->
  <path d="M 565 74 L 565 84 M 430 84 L 715 84" class="line-trunk" />

  <!-- 1. Nodo Carpintería (Puestos rotativos) -->
  <path d="M 430 84 L 430 92" class="line-trunk" marker-end="url(#arrow)" />
  <g id="nodo-carpinteria">
    <rect x="368" y="92" width="124" height="25" rx="4" class="node-teal" />
    <text x="430" y="103.5" font-size="7.5" font-weight="700" fill="#042f2e" text-anchor="middle">Carpintería</text>
    <text x="430" y="112.5" font-size="6.2" font-weight="500" fill="#0f766e" text-anchor="middle">Puestos rotativos</text>
  </g>

  <!-- Conexión hacia los 9 Puestos de Carpintería -->
  <path d="M 430 117 L 430 124 M 310 124 L 550 124" class="line-carpinteria" />

  <!-- Fila 1 de Puestos (5 puestos: Puesto 1 a 5) -->
  <!-- Puesto 1 -->
  <path d="M 310 124 L 310 130" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="290" y="130" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="310" y="141.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 2 -->
  <path d="M 370 124 L 370 130" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="350" y="130" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="370" y="141.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 3 -->
  <path d="M 430 124 L 430 130" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="410" y="130" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="430" y="141.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 4 -->
  <path d="M 490 124 L 490 130" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="470" y="130" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="490" y="141.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 5 -->
  <path d="M 550 124 L 550 130" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="530" y="130" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="550" y="141.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Fila 2 de Puestos (4 puestos: Puesto 6 a 9) -->
  <path d="M 430 147 L 430 156 M 340 156 L 520 156" class="line-carpinteria" />

  <!-- Puesto 6 -->
  <path d="M 340 156 L 340 162" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="320" y="162" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="340" y="173.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 7 -->
  <path d="M 400 156 L 400 162" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="380" y="162" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="400" y="173.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 8 -->
  <path d="M 460 156 L 460 162" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="440" y="162" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="460" y="173.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- Puesto 9 -->
  <path d="M 520 156 L 520 162" class="line-carpinteria" marker-end="url(#arrow-teal)" />
  <rect x="500" y="162" width="40" height="17" rx="3" class="node-green-leaf" />
  <text x="520" y="173.5" font-size="6.5" font-weight="600" fill="#14532d" text-anchor="middle">Puesto 1</text>

  <!-- 2, 3, 4. Especialidades directas de Planta (Tapicería, CNC, Pintura) -->
  <!-- Tapicería -->
  <path d="M 610 84 L 610 130" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="588" y="130" width="44" height="22" rx="3" class="node-green-leaf" />
  <text x="610" y="144" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">Tapicería</text>

  <!-- CNC -->
  <path d="M 665 84 L 665 130" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="646" y="130" width="38" height="22" rx="3" class="node-green-leaf" />
  <text x="665" y="144" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">CNC</text>

  <!-- Pintura -->
  <path d="M 715 84 L 715 130" class="line-trunk" marker-end="url(#arrow)" />
  <rect x="694" y="130" width="42" height="22" rx="3" class="node-green-leaf" />
  <text x="715" y="144" font-size="6.8" font-weight="600" fill="#14532d" text-anchor="middle">Pintura</text>
</svg>
